<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MPP.sol — Scene 1: Direct Mode</title>
<style>
:root {
  --bg: #0a0a0c; --bg-soft: #14141a; --bg-card: #1a1a22;
  --fg: #e8e8ee; --fg-dim: #9da0ad; --fg-faint: #6b6e7a;
  --accent: #14F195; --accent-2: #9945FF; --orange: #FFB800;
  --red: #ff6b6b; --border: #2a2a36;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--fg); width: 1280px; height: 800px;
  font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
.viewport { padding: 28px 44px; }
.titlebar {
  display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
  padding-bottom: 14px; border-bottom: 1px solid var(--border);
}
.tdot { width: 12px; height: 12px; border-radius: 50%; }
.tdot.r { background: #ff5f57; } .tdot.y { background: #ffbd2e; } .tdot.g { background: #28ca42; }
.titletext { margin-left: 14px; color: var(--fg-dim); font-size: 0.92em; letter-spacing: 0.04em; }
.titlebrand { color: var(--accent); font-weight: 600; }
.titlesub { color: var(--fg-faint); margin-left: 10px; }
.scenebadge {
  margin-left: auto; font-size: 0.78em; color: var(--accent);
  letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600;
}

.term { font-size: 15.5px; line-height: 1.62; }
.line { display: block; min-height: 1.62em; white-space: pre-wrap; word-break: break-word; }
.line.cmd { color: var(--accent); }
.line.cmd::before { content: "$ "; color: var(--fg-faint); }
.line.comment { color: var(--fg-faint); }
.line.comment::before { content: "# "; color: var(--fg-faint); }
.line.arrow { color: var(--accent); }
.line.arrow::before { content: "→ "; color: var(--accent); }
.line.success { color: var(--accent); }
.line.success::before { content: "✓ "; color: var(--accent); }
.line.bracketed { color: var(--fg-dim); }
.line.bracketed b { color: var(--orange); font-weight: 500; }
.line.bracketed em { color: var(--accent); font-style: normal; }
.line.spacer { min-height: 0.55em; }
.line.divider {
  border-top: 1px dashed var(--border); margin: 12px 0 8px; padding-top: 8px;
  color: var(--accent-2); font-size: 0.82em; text-transform: uppercase;
  letter-spacing: 0.14em; min-height: auto;
}
.line.http { color: var(--orange); font-weight: 600; }
.line.http::before { content: "← "; color: var(--orange); }
.line.tx-hash { color: var(--fg); padding-left: 2ch; font-size: 0.93em; word-break: break-all; }
.line.tx-hash a { color: var(--accent); text-decoration: none; }
.cursor {
  display: inline-block; width: 0.5ch; height: 1.05em;
  vertical-align: text-bottom; background: var(--accent);
  margin-left: 2px; animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="viewport">
  <div class="titlebar">
    <span class="tdot r"></span><span class="tdot y"></span><span class="tdot g"></span>
    <span class="titletext"><span class="titlebrand">mppsol-direct</span><span class="titlesub">@mppsol/server + @mppsol/agent</span></span>
    <span class="scenebadge">Scene 1 · Direct Mode</span>
  </div>
  <div id="term" class="term"></div>
</div>
<script>
const LINES = [
  { type: 'comment', text: 'Direct mode: one-shot HTTP 402 payment, real Solana devnet tx' },
  { type: 'spacer' },
  { type: 'comment', text: 'STEP 1 — start the MPP-protected server' },
  { type: 'cmd', text: 'bun run examples/hono.ts  # @mppsol/server' },
  { type: 'bracketed', text: '[setup] mounted POST /v1/joke with mppMiddleware' },
  { type: 'bracketed', text: '[setup] recipient: 7xKpQHL2yz...J4Vp · mint: USDC' },
  { type: 'bracketed', text: '[setup] cluster: devnet · scheme: solana-direct' },
  { type: 'success', text: 'listening on http://localhost:3000' },
  { type: 'spacer' },
  { type: 'divider', text: 'STEP 2 — agent fetches resource · gets 402' },
  { type: 'cmd', text: 'await mppFetch("http://localhost:3000/v1/joke")' },
  { type: 'http', text: 'HTTP/1.1 402 Payment Required' },
  { type: 'bracketed', text: 'WWW-Authenticate: Payment realm="demo.mppsol.org"' },
  { type: 'bracketed', text: '  scheme="solana-direct"  amount="1000"' },
  { type: 'bracketed', text: '  recipient="..." mint="..." nonce="<em>0xa3f0b7...</em>"' },
  { type: 'spacer' },
  { type: 'divider', text: 'STEP 3 — build · sign · submit a real Solana tx' },
  { type: 'cmd', text: 'agent.buildTx({ transfer + Memo(nonce) })' },
  { type: 'bracketed', text: '[tx] SPL transfer: 0.001 USDC → recipient' },
  { type: 'bracketed', text: '[tx] memo ix: nonce binding (b58 encoded)' },
  { type: 'success', text: 'submitted to api.devnet.solana.com' },
  { type: 'success', text: 'confirmed in 1 slot · 17,236 compute units · 0.000005 SOL fee' },
  { type: 'spacer' },
  { type: 'divider', text: 'STEP 4 — server verifies on-chain · returns the resource' },
  { type: 'bracketed', text: '[server] getTransaction(sig) via RPC' },
  { type: 'bracketed', text: '[server] validate: SPL transfer ✓ · recipient ✓ · amount ✓ · nonce ✓' },
  { type: 'http', text: 'HTTP/1.1 200 OK' },
  { type: 'bracketed', text: 'Payment-Receipt: scheme="solana-direct" tx="..." slot="460181691"' },
  { type: 'bracketed', text: 'Body: <em>"Why don\'t scientists trust atoms? Because they make up everything."</em>' },
  { type: 'spacer' },
  { type: 'arrow', text: 'real on-chain payment — verifiable on Solana Explorer' },
  { type: 'tx-hash', text: 'tx <a>4ycgDjjD9AgM5qT51qwxjvnrerP2VFgP2tn8GFxvWD3tvYprE2jsyjQcQ3ZCjCjcaP34DXdYmKdcbjKAFh9Zf2qJ</a>' },
];

const term = document.getElementById('term');
const PER_LINE = 600;
const CHAR_DELAY = 10;

async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function typeLine(line) {
  const el = document.createElement('span');
  el.className = `line ${line.type}`;
  term.appendChild(el);
  if (line.type === 'spacer' || line.type === 'divider') {
    if (line.text) el.innerHTML = line.text;
    return;
  }
  const text = line.text;
  let isTag = false, buffer = '';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '<') isTag = true;
    buffer += ch;
    if (ch === '>') { isTag = false; el.innerHTML = buffer; continue; }
    if (!isTag) {
      el.innerHTML = buffer;
      await sleep(CHAR_DELAY);
    }
  }
}

window.startScene = async () => {
  for (const line of LINES) {
    await typeLine(line);
    await sleep(PER_LINE - (line.text?.length || 0) * CHAR_DELAY);
  }
  const cur = document.createElement('span');
  cur.className = 'cursor';
  term.appendChild(cur);
  await sleep(3500);
  window.__sceneDone = true;
};
</script>
</body>
</html>
